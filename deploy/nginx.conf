# -----------------------------------------------------------------------------
# nginx server block for the EPROM CMS single-page app (clean-URL routing).
#
# The app uses History-API routing (see routes.ts). Every route is a real URL
# (e.g. /admin/users, /ceo/profile/123), so nginx MUST serve index.html for any
# path that isn't a real file — otherwise a deep-link or hard refresh 404s.
# That is what `try_files ... /index.html` below does.
#
# Deploy: build with `npm run build`, copy the generated `dist/` to the root
# below, then `nginx -t && systemctl reload nginx`.
# -----------------------------------------------------------------------------

server {
    listen 80;
    # listen 443 ssl http2;   # enable once TLS certs are installed
    server_name cms.your-company-domain.com;   # <-- set your company domain

    # Point at the built Vite output (dist/). Vite's `base` is '/', so the app
    # is served from the domain root.
    root /var/www/ecms/dist;
    index index.html;

    # gzip text assets (Vite already minifies; this shrinks transfer further).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fingerprinted build assets (Vite hashes filenames) — cache hard & long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: hand any unmatched path to the app so client-side routing
    # can resolve it. This is the line that makes clean URLs survive refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell, so a new deploy is picked up immediately
    # (the shell references the freshly-hashed asset filenames).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Basic hardening (optional but recommended).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
