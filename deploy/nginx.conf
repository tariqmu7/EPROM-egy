# -----------------------------------------------------------------------------
# nginx server block for the EPROM CMS single-page app (clean-URL routing).
#
# This is the STANDALONE HOST install (nginx installed on the VM directly). The
# Docker deploy uses deploy/nginx/nginx.conf instead — keep the two in step; the
# header set below is the same one deploy/nginx/security-headers.inc holds,
# written out inline here because a host install has no shared include path.
#
# The app uses History-API routing (see routes.ts). Every route is a real URL
# (e.g. /admin/users, /ceo/profile/123), so nginx MUST serve index.html for any
# path that isn't a real file — otherwise a deep-link or hard refresh 404s.
# That is what `try_files ... /index.html` below does.
#
# Deploy: build with `npm run build`, copy the generated `dist/` to the root
# below, then `nginx -t && systemctl reload nginx`.
# -----------------------------------------------------------------------------

server {
    listen 80;
    # listen 443 ssl;   # see the TLS notes at the bottom of this file
    server_name cms.your-company-domain.com;   # <-- set your company domain

    server_tokens off;

    # Point at the built Vite output (dist/). Vite's `base` is '/', so the app
    # is served from the domain root.
    root /var/www/ecms/dist;
    index index.html;

    client_max_body_size 6m;   # matches the API's 5mb JSON limit + headroom

    # gzip text assets (Vite already minifies; this shrinks transfer further).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ─────────────────────────────────────────────────────
    # Mirrors deploy/nginx/security-headers.inc; see that file for why each
    # directive is what it is. The short version: every dependency is bundled by
    # Vite and the font is self-hosted, so the app loads nothing from the
    # internet and `script-src 'self'` can be strict. 'unsafe-inline' is needed
    # for STYLE only (React inline style attributes), and data:/blob: images are
    # required because ECMS stores avatars, certificate scans and evidence
    # images as base64 data URLs inside the document.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:" always;

    # Fingerprinted build assets (Vite hashes filenames) — cache hard & long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: hand any unmatched path to the app so client-side routing
    # can resolve it. This is the line that makes clean URLs survive refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell, so a new deploy is picked up immediately
    # (the shell references the freshly-hashed asset filenames). add_header does
    # not inherit into a block that declares one, so the set is repeated here.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:" always;
        add_header Cache-Control "no-store";
    }
}

# ── TLS (see deploy/tls/README.md) ───────────────────────────────────────────
# Once IT provides a certificate, add these lines to the server block above,
# switch `listen 80` to `listen 443 ssl;` + `http2 on;`, and add a second tiny
# server block on port 80 that does `return 301 https://$host$request_uri;`.
#
#   ssl_certificate     /etc/nginx/certs/ecms.crt;
#   ssl_certificate_key /etc/nginx/certs/ecms.key;
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_prefer_server_ciphers off;
#   ssl_session_cache shared:ECMS_TLS:10m;
#   ssl_session_tickets off;
#   add_header Strict-Transport-Security "max-age=15768000" always;   # https ONLY
