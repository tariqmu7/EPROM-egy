# nginx: serve the SPA + reverse-proxy the API. The `api` host resolves to the
# api container on the compose network.
#
# This is the PLAIN HTTP site. To put the system on https, follow
# deploy/tls/README.md — it mounts a certificate plus deploy/nginx/tls.conf,
# after which the server block below is replaced by the redirect at the bottom.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version on error pages or the Server header.
    server_tokens off;

    include /etc/nginx/conf.d/security-headers.inc;

    client_max_body_size 6m;   # matches the API's 5mb JSON limit + headroom

    # API — strip the /api prefix so the backend sees /auth, /col, /batch, /health
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Fingerprinted build assets (Vite hashes filenames) — cache hard & long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell, so a new deploy is picked up immediately.
    # The header set is re-included because add_header does not inherit into a
    # block that declares one of its own.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store";
    }

    # SPA — everything else falls back to index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Once TLS is on (deploy/tls/README.md), replace the whole server block above
#    with this redirect, so nothing is ever served in the clear:
#
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }
