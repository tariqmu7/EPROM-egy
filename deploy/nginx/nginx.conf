# nginx: serve the SPA + reverse-proxy the API. The `api` host resolves to the
# api container on the compose network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (tune CSP once asset origins are finalised).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 6m;   # matches the API's 5mb JSON limit + headroom

    # API — strip the /api prefix so the backend sees /auth, /col, /batch, /health
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA — everything else falls back to index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

