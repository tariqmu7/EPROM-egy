# ─── HTTPS site — NOT active by default ──────────────────────────────────────
# This file is deliberately NOT copied into the image. nginx refuses to start
# when ssl_certificate points at a file that isn't there, so shipping it enabled
# would mean a stack that cannot boot until IT hands over a certificate.
#
# To turn HTTPS on, follow deploy/tls/README.md: put the certificate and key in
# deploy/tls/certs/, uncomment the two web-service volumes in docker-compose.yml
# (which mount the certs and THIS file), then replace the port-80 server block
# in deploy/nginx/nginx.conf with the redirect written at the bottom of it.

server {
    listen 443 ssl;
    http2 on;
    server_name cms.eprom.local;          # <-- the DNS name users actually type

    ssl_certificate     /etc/nginx/certs/ecms.crt;
    ssl_certificate_key /etc/nginx/certs/ecms.key;

    # TLS 1.2/1.3 only. 1.0 and 1.1 are withdrawn, and they would be the weakest
    # link in a system whose entire authentication is a bearer token on the wire.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;        # modern clients choose; 1.3 suites are fixed
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:ECMS_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/conf.d/security-headers.inc;
    # HSTS lives ONLY on the https site, never on the http one. Six months, and
    # no `preload` — preload is effectively irreversible and this is an internal
    # name. Add includeSubDomains only if nothing else runs on a sibling host.
    add_header Strict-Transport-Security "max-age=15768000" always;

    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
