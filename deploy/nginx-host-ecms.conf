# ─────────────────────────────────────────────────────────────────────────────
# HOST nginx server block for the EPROM CMS  (goes on the SERVER's own nginx —
# the one already serving ese.eprom.com.eg — NOT inside any container).
#
# What it does: requests for ecms.eprom.com.eg arrive at the existing nginx and
# are forwarded to our Docker app listening on 127.0.0.1:8080. Your friend's
# site is untouched.
#
# INSTALL (do this WITH IT, or hand them this file):
#   1. Save as:  /etc/nginx/sites-available/ecms.eprom.com.eg
#   2. Enable:   sudo ln -s /etc/nginx/sites-available/ecms.eprom.com.eg \
#                           /etc/nginx/sites-enabled/
#      (On some setups the folder is /etc/nginx/conf.d/ — put the file there
#       instead and skip the symlink.)
#   3. Test:     sudo nginx -t
#   4. Apply:    sudo systemctl reload nginx      # reload = no downtime for the
#                                                 #          friend's live site
#
# Set the real subdomain IT gives you and the WEB_PORT you chose in .env.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name ecms.eprom.com.eg;          # <-- the subdomain IT assigns you

    client_max_body_size 6m;                 # matches the app's upload limit

    location / {
        proxy_pass http://127.0.0.1:8080;    # <-- must match WEB_PORT in .env
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
# Once the friend's site already has HTTPS, IT most likely uses certbot. To give
# THIS subdomain a certificate too, after the block above is live run:
#     sudo certbot --nginx -d ecms.eprom.com.eg
# certbot rewrites this block to add `listen 443 ssl` and the HTTP→HTTPS redirect.
