name: CI

# Validation-only pipeline. Deployment is handled out-of-band: the app is built
# (`npm run build`) and the resulting `dist/` is served by nginx on the company
# domain (see deploy/nginx.conf). The previous GitHub Pages deploy job was
# removed when the app moved off GitHub Pages to a company-domain nginx host.

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # A6.3 — catch high/critical vulnerabilities. Scoped to production deps
      # (--omit=dev): the deployed static bundle ships only prod dependencies.
      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

      # A6.1 — fail on TypeScript errors
      - name: Type check
        run: npm run typecheck

      # A6.2 — fail on lint errors
      - name: Lint
        run: npm run lint

      # A4.8 — run tests and enforce coverage on src/services/store.ts
      - name: Test with coverage
        run: npm run test:coverage

      # Backend (self-hosted API): typecheck + authz/auth tests (pg-mem, no DB needed).
      - name: Backend install
        run: npm install
        working-directory: server

      - name: Backend typecheck
        run: npm run typecheck
        working-directory: server

      - name: Backend tests
        run: npm test
        working-directory: server

      # Verify the production bundle compiles. The dist/ output is deployed to
      # the nginx host out-of-band (not uploaded here). VITE_API_URL is baked at
      # build time on the deploy host; the client falls back to '/api' if unset.
      - name: Build
        run: npm run build
