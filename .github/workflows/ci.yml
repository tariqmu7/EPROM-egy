name: CI

# Validation-only pipeline. Deployment is handled out-of-band: the app is built
# (`npm run build`) and the resulting `dist/` is served by nginx on the company
# domain (see deploy/nginx.conf). The previous GitHub Pages deploy job was
# removed when the app moved off GitHub Pages to a company-domain nginx host.

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # A6.3 — catch high/critical vulnerabilities. Scoped to production deps
      # (--omit=dev): the deployed static bundle ships only prod dependencies.
      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

      # A6.1 — fail on TypeScript errors
      - name: Type check
        run: npm run typecheck

      # A6.2 — fail on lint errors
      - name: Lint
        run: npm run lint

      # A4.8 — run tests and enforce coverage on services/store.ts
      - name: Test with coverage
        run: npm run test:coverage

      - name: Regenerate Firestore rules from template
        run: npm run rules:build
        env:
          VITE_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.VITE_BOOTSTRAP_ADMIN_EMAIL }}

      # A6.4 — block the build if any required Firebase env var is missing
      - name: Validate Firebase env vars
        run: npm run check-env
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      # Verify the production bundle compiles. The dist/ output is deployed to
      # the nginx host out-of-band (not uploaded here).
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
