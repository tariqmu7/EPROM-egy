# EPROM CMS — full self-hosted stack for the EPROM Linux VM.
#   postgres  — the database (persistent volume)
#   api       — Node + Express API (runs migrations on boot)
#   web       — nginx serving the SPA + proxying /api
#   backup    — nightly pg_dump to ./backups, 30-day retention
#
# Usage:  cp .env.docker.example .env  &&  edit .env  &&  docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./server
    environment:
      PORT: "4000"
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGSSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # One reverse proxy (the `web` nginx container) fronts the API, so Express
      # must read the caller from X-Forwarded-For — otherwise the rate limiters
      # bucket the whole company under nginx's IP.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Nightly sweep (server/src/jobs/) — runs in THIS container, not a crontab.
      # Container time is UTC unless the host says otherwise, so 02:00 here is
      # 02:00 UTC = 04:00 Cairo. Both are quiet; change JOBS_HOUR if that matters.
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      JOBS_HOUR: ${JOBS_HOUR:-2}
      JOBS_MINUTE: ${JOBS_MINUTE:-0}
    depends_on:
      postgres:
        condition: service_healthy
    # Liveness via the /health endpoint. Dependency-free (no curl/wget in the
    # alpine image) using a tiny Node HTTP probe. start_period covers boot-time
    # DB migrations so early failures don't flap the container.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
      - "443:443"
    # ── HTTPS (off by default) ────────────────────────────────────────────────
    # nginx will not start if ssl_certificate names a file that isn't there, so
    # the https site ships as a separate file that is mounted in only once a
    # certificate exists. Uncomment BOTH lines, put ecms.crt + ecms.key in
    # deploy/tls/certs/, and follow deploy/tls/README.md.
    # volumes:
    #   - ./deploy/tls/certs:/etc/nginx/certs:ro
    #   - ./deploy/nginx/tls.conf:/etc/nginx/conf.d/tls.conf:ro
    # Only start serving once the API is actually healthy, not merely started —
    # otherwise the first requests through /api race the API's boot/migrations.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/backups
      # The loop lives in a real script, not in this YAML string: it has to tell
      # a failed pg_dump apart from a successful one (gzip succeeds on an empty
      # pipe) and must never prune old dumps after a failure. See deploy/backup.sh.
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
